name: Build Linux server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-linux-server
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with engine submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch engine tags
        run: |
          cd RobustToolbox
          git fetch --depth=1

      - name: Build and package the server (linux-x64, hybrid ACZ)
        run: |
          set -e
          dotnet restore
          dotnet build Content.Packaging --configuration Release --no-restore /m
          dotnet run --project Content.Packaging server --hybrid-acz --platform linux-x64
          ls -la release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="server-$(date -u +%Y.%m.%d-%H%M)-$(git rev-parse --short HEAD)"
          gh release create "$tag" \
            -R "${{ github.repository }}" \
            -t "Server build $tag" \
            -n "Linux server build of ${{ github.sha }}" \
            --latest \
            release/SS14.Server_linux-x64.zip
